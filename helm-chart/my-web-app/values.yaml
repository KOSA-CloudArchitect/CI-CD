# values.yaml
# 이 파일은 Argo CD가 참조하는 핵심 설정 파일입니다.

replicaCount: 1

image:
  repository: 890571109462.dkr.ecr.ap-northeast-2.amazonaws.com/web-server-backend
  pullPolicy: IfNotPresent
  # Jenkins가 이 태그를 빌드 번호로 업데이트합니다.
  tag: "backend-build-77"

service:
  type: ClusterIP
  port: 8080

# CPU와 메모리 리소스 요청량 및 제한량 설정
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}
